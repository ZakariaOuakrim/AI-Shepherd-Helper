apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: kafka
spec:
  serviceName: kafka-headless
  replicas: 2
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      initContainers:
      - name: wait-for-zookeeper
        image: busybox:1.35
        command: ['sh', '-c']
        args:
        - |
          echo "Waiting for Zookeeper..."
          until nc -z zookeeper-headless 2181; do
            echo "Zookeeper not ready, waiting..."
            sleep 3
          done
          echo "Zookeeper is ready!"
      containers:
      - name: kafka
        image: confluentinc/cp-kafka:7.4.0
        ports:
        - containerPort: 9092
        - containerPort: 9093
        env:
        - name: KAFKA_ZOOKEEPER_CONNECT
          value: "zookeeper-headless:2181"
        - name: KAFKA_LISTENERS
          value: "PLAINTEXT://0.0.0.0:9092"
        - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
          value: "PLAINTEXT:PLAINTEXT"
        - name: KAFKA_INTER_BROKER_LISTENER_NAME
          value: "PLAINTEXT"
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: "1"
        - name: KAFKA_DEFAULT_REPLICATION_FACTOR
          value: "1"
        - name: KAFKA_MIN_IN_SYNC_REPLICAS
          value: "1"
        - name: KAFKA_NUM_PARTITIONS
          value: "3"
        - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
          value: "true"
        - name: KAFKA_HEAP_OPTS
          value: "-Xmx512M -Xms512M"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        volumeMounts:
        - name: kafka-data
          mountPath: /var/lib/kafka/data
        readinessProbe:
          tcpSocket:
            port: 9092
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          tcpSocket:
            port: 9092
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        command:
        - sh
        - -exc
        - |
          # Extract broker ID from pod name (kafka-0 -> 0, kafka-1 -> 1)
          export KAFKA_BROKER_ID=${HOSTNAME##*-}
          
          # Set advertised listeners using the pod name
          export KAFKA_ADVERTISED_LISTENERS="PLAINTEXT://${POD_NAME}.kafka-headless.${POD_NAMESPACE}.svc.cluster.local:9092"
          
          echo "Starting Kafka with the following configuration:"
          echo "BROKER_ID: $KAFKA_BROKER_ID"
          echo "Pod Name: $POD_NAME"
          echo "Namespace: $POD_NAMESPACE"
          echo "Zookeeper Connect: $KAFKA_ZOOKEEPER_CONNECT"
          echo "Advertised Listeners: $KAFKA_ADVERTISED_LISTENERS"
          
          # Test Zookeeper connectivity before starting
          echo "Testing Zookeeper connection..."
          until echo ruok | nc zookeeper-headless 2181 2>/dev/null; do
            echo "Waiting for Zookeeper..."
            sleep 2
          done
          echo "Zookeeper is responsive"
          
          # Start Kafka
          exec /etc/confluent/docker/run
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
  volumeClaimTemplates:
  - metadata:
      name: kafka-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi
---
apiVersion: v1  
kind: Service
metadata:
  name: kafka-headless
  namespace: kafka
spec:
  clusterIP: None
  ports:
  - port: 9092
    targetPort: 9092
    name: kafka
  selector:
    app: kafka